<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6ece4">
<title>Para Ale · Nuestro primer mes</title>
<meta name="description" content="Una tarjetita cada día hasta cumplir nuestro primer mes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="hero">
  <p class="eyebrow">11 de noviembre · nuestro primer mes</p>
  <h1>Para <em>Ale</em></h1>
  <p class="lede">Una tarjetita por día, hasta que llegue el día que cumplimos un mes juntos.</p>
  <div class="countdown" id="countdown" aria-live="polite"></div>
</header>

<main>
  <ol class="cards" id="cards"></ol>
</main>

<footer>
  <p>Hecho con cariño por Camilo, para ti.</p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <article class="modal__card" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="modal__close" data-close aria-label="Cerrar">×</button>
    <p class="modal__day" id="m-day"></p>
    <h2 id="m-title"></h2>
    <div class="modal__body" id="m-body"></div>
    <p class="modal__sign" id="m-sign"></p>
  </article>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<script src="script.js"></script>
</body>
</html>
