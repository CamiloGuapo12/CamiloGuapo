<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a1e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a259ff"/>
      <stop offset="100%" style="stop-color:#6a3de8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5c4"/>
      <stop offset="100%" style="stop-color:#00c4a0"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd60a"/>
      <stop offset="100%" style="stop-color:#ff9f0a"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Línea de tendencia (chart line) -->
  <polyline
    points="80,340 160,280 240,310 320,200 400,240 440,160"
    fill="none"
    stroke="#ffffff10"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Barras del gráfico -->
  <rect x="82" y="260" width="58" height="140" rx="12" fill="url(#bar2)" opacity="0.85"/>
  <rect x="162" y="200" width="58" height="200" rx="12" fill="url(#bar1)" opacity="0.95"/>
  <rect x="242" y="230" width="58" height="170" rx="12" fill="url(#bar3)" opacity="0.85"/>
  <rect x="322" y="160" width="58" height="240" rx="12" fill="url(#bar1)" opacity="0.95"/>
  <rect x="402" y="210" width="58" height="190" rx="12" fill="url(#bar4)" opacity="0.85"/>

  <!-- Punto LIVE rojo pulsante (círculo sólido) -->
  <circle cx="390" cy="112" r="38" fill="#ff2d55" opacity="0.2"/>
  <circle cx="390" cy="112" r="26" fill="#ff2d55" opacity="0.4"/>
  <circle cx="390" cy="112" r="16" fill="#ff2d55"/>

  <!-- Texto LT minimalista -->
  <text x="256" y="490" 
    font-family="'Arial Black', 'Arial Bold', sans-serif" 
    font-size="64" font-weight="900"
    text-anchor="middle"
    fill="#ffffff"
    opacity="0.15"
    letter-spacing="8">LIVE</text>
</svg>
